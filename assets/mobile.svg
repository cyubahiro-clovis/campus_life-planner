<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1640" viewBox="0 0 360 1640" font-family="Arial, sans-serif" font-size="12">
  <title>Mobile wireframe (360px)</title>
  <rect width="360" height="1640" fill="#fafafa"/>

  <!-- header: site name in the h1, a tagline, nav buttons that wrap -->
  <rect x="0" y="0" width="360" height="132" fill="#d6d6d6"/>
  <text x="16" y="30" font-weight="bold" font-size="17">Campus Life Planner</text>
  <text x="16" y="50" fill="#555">Classes, labs, deadlines and club nights</text>
  <g fill="#fff" stroke="#888">
    <rect x="16" y="64" width="84" height="26" rx="13"/>
    <rect x="106" y="64" width="54" height="26" rx="13"/>
    <rect x="166" y="64" width="72" height="26" rx="13"/>
    <rect x="16" y="96" width="70" height="26" rx="13"/>
    <rect x="92" y="96" width="58" height="26" rx="13"/>
  </g>
  <text x="28" y="81">Dashboard</text><text x="117" y="81">Tasks</text><text x="176" y="81">Add task</text>
  <text x="27" y="113">Settings</text><text x="103" y="113">About</text>

  <!-- dashboard -->
  <rect x="16" y="148" width="328" height="470" rx="12" fill="#fff" stroke="#bbb"/>
  <text x="32" y="176" font-size="16" font-weight="bold">Dashboard</text>
  <g fill="#f0f0f0" stroke="#ccc">
    <rect x="32" y="188" width="142" height="58" rx="8"/>
    <rect x="186" y="188" width="142" height="58" rx="8"/>
    <rect x="32" y="254" width="296" height="58" rx="8"/>
  </g>
  <text x="42" y="206" fill="#555">Total tasks</text><text x="42" y="232" font-size="18" font-weight="bold">16</text>
  <text x="196" y="206" fill="#555">Total time</text><text x="196" y="232" font-size="18" font-weight="bold">3052 min</text>
  <text x="42" y="272" fill="#555">Top tag</text><text x="42" y="298" font-size="18" font-weight="bold">Study</text>
  <text x="110" y="298" fill="#555">3 tasks</text>

  <rect x="32" y="322" width="296" height="160" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="44" y="342" font-weight="bold">Last 7 days</text>
  <text x="44" y="358" fill="#555" font-size="10">a sentence with the total and busiest day</text>
  <g fill="#9e9e9e">
    <rect x="50" y="452" width="26" height="2"/><rect x="88" y="446" width="26" height="8"/>
    <rect x="126" y="384" width="26" height="70"/><rect x="164" y="420" width="26" height="34"/>
    <rect x="202" y="408" width="26" height="46"/><rect x="240" y="430" width="26" height="24"/>
    <rect x="278" y="452" width="26" height="2"/>
  </g>
  <line x1="44" y1="455" x2="316" y2="455" stroke="#888"/>
  <g fill="#555" font-size="9" text-anchor="middle">
    <text x="63" y="470">10-10</text><text x="101" y="470">10-11</text><text x="139" y="470">10-12</text>
    <text x="177" y="470">10-13</text><text x="215" y="470">10-14</text><text x="253" y="470">10-15</text>
    <text x="291" y="470" font-weight="bold">Today</text>
  </g>

  <rect x="32" y="492" width="296" height="112" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="44" y="512" font-weight="bold">Time cap</text>
  <text x="44" y="530" fill="#555" font-size="10">Cap in hours</text>
  <rect x="44" y="536" width="190" height="26" rx="6" fill="#fff" stroke="#888"/>
  <rect x="242" y="536" width="74" height="26" rx="6" fill="#bdbdbd"/><text x="256" y="553">Set cap</text>
  <rect x="44" y="570" width="272" height="6" rx="3" fill="#e0e0e0"/><rect x="44" y="570" width="200" height="6" rx="3" fill="#9e9e9e"/>
  <text x="44" y="594" fill="#555" font-size="10">[aria-live] polite under the cap, assertive when over</text>

  <!-- tasks: search, sort, then one card per task -->
  <rect x="16" y="634" width="328" height="540" rx="12" fill="#fff" stroke="#bbb"/>
  <text x="32" y="662" font-size="16" font-weight="bold">Tasks</text>
  <text x="32" y="684" fill="#555">Search with a regex</text>
  <rect x="32" y="690" width="296" height="28" rx="6" fill="#fff" stroke="#888"/>
  <text x="42" y="708" fill="#999">lab|exam or @tag:study</text>
  <rect x="32" y="726" width="14" height="14" fill="#fff" stroke="#888"/>
  <text x="52" y="738">Ignore case</text>
  <text x="32" y="762" fill="#555">Sort by</text>
  <rect x="32" y="768" width="296" height="26" rx="6" fill="#fff" stroke="#888"/>
  <text x="42" y="785">Due date, soonest first ▾</text>
  <text x="32" y="812" fill="#555" font-size="10">Try @tag:study · \b\d{2}:\d{2}\b · ^(lab|lecture)</text>
  <text x="32" y="830" fill="#555" font-size="10">[role=status] Showing all 16 tasks.</text>

  <g fill="#f5f5f5" stroke="#ccc">
    <rect x="32" y="842" width="296" height="120" rx="8"/>
    <rect x="32" y="972" width="296" height="80" rx="8"/>
  </g>
  <text x="44" y="864" font-weight="bold">Leap day birthday call</text>
  <text x="44" y="884"><tspan fill="#555">Due:</tspan> 2024-02-29</text>
  <text x="44" y="902"><tspan fill="#555">Duration:</tspan> 15 min</text>
  <text x="44" y="922" fill="#555">Tag:</text>
  <rect x="72" y="910" width="56" height="16" rx="8" fill="#ddd"/><text x="78" y="922" font-size="10">Personal</text>
  <rect x="44" y="932" width="48" height="24" rx="6" fill="#fff" stroke="#888"/><text x="56" y="948">Edit</text>
  <rect x="100" y="932" width="60" height="24" rx="6" fill="#fff" stroke="#888"/><text x="110" y="948">Delete</text>
  <text x="44" y="996" font-weight="bold">Each card is one table row</text>
  <text x="44" y="1016" fill="#555">CSS hides the headings, and data-label</text>
  <text x="44" y="1032" fill="#555">adds "Due:" and "Tag:" to the cells</text>

  <rect x="32" y="1062" width="296" height="100" rx="8" fill="#f5f5f5" stroke="#888" stroke-dasharray="4 3"/>
  <text x="44" y="1084" font-weight="bold">Inline edit opens inside the card</text>
  <text x="44" y="1102" fill="#555">labelled fields, Enter saves, Esc cancels</text>
  <rect x="44" y="1110" width="272" height="20" rx="4" fill="#fff" stroke="#888"/>
  <rect x="44" y="1136" width="48" height="20" rx="5" fill="#9e9e9e"/><text x="54" y="1150" fill="#fff">Save</text>
  <rect x="98" y="1136" width="56" height="20" rx="5" fill="#fff" stroke="#888"/><text x="106" y="1150">Cancel</text>

  <!-- add form -->
  <rect x="16" y="1190" width="328" height="296" rx="12" fill="#fff" stroke="#bbb"/>
  <text x="32" y="1218" font-size="16" font-weight="bold">Add a task</text>
  <text x="32" y="1242" fill="#555">Title</text>
  <rect x="32" y="1248" width="296" height="28" rx="6" fill="#fff" stroke="#888"/>
  <text x="32" y="1296" fill="#555">Due date</text>
  <rect x="32" y="1302" width="296" height="28" rx="6" fill="#fff" stroke="#888"/>
  <text x="42" y="1320" fill="#999">YYYY-MM-DD</text>
  <text x="32" y="1350" fill="#555">Duration (minutes)</text>
  <rect x="32" y="1356" width="296" height="28" rx="6" fill="#fff" stroke="#c62828" stroke-width="2"/>
  <text x="32" y="1398" fill="#c62828" font-size="11">error message under the field (aria-live)</text>
  <text x="32" y="1420" fill="#555">Tag</text>
  <rect x="32" y="1426" width="296" height="28" rx="6" fill="#fff" stroke="#888"/>
  <rect x="32" y="1460" width="96" height="20" rx="5" fill="#9e9e9e"/><text x="52" y="1474" fill="#fff">Add task</text>

  <!-- settings, about, footer -->
  <rect x="16" y="1500" width="328" height="40" rx="12" fill="#fff" stroke="#bbb"/>
  <text x="32" y="1525" font-weight="bold">Settings: units, converter, import / export</text>
  <rect x="16" y="1550" width="328" height="40" rx="12" fill="#fff" stroke="#bbb"/>
  <text x="32" y="1575" font-weight="bold">About: purpose, contact, keyboard tips</text>
  <rect x="0" y="1606" width="360" height="34" fill="#d6d6d6"/>
  <text x="16" y="1627" fill="#555">Footer: © 2026 · tests · scraper · source</text>
</svg>
